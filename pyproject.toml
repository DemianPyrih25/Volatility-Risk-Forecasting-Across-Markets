[project]
name = "volrisk"
version = "0.1.0"
description = "Volatility & risk forecasting across crypto, FX and equities: realized measures, HAR/GARCH/ML forecasts, implied-vol benchmarks and Basel-style VaR/ES backtesting."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2,<3",
    "polars>=1.30",
    "pyarrow>=18",
    "duckdb>=1.2",
    "scipy>=1.14",
    "statsmodels>=0.14.4",
    "arch>=7.2",
    "lightgbm>=4.5",
    "torch>=2.6",
    "exchange-calendars>=4.10",
    "tzdata>=2024.1",
    "requests>=2.32",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "dash>=2.18",
    "plotly>=5.24",
    "opentimestamps-client>=0.7",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volrisk", "src/volrisk_live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: statistical size/power simulations and full-size runtime checks (run with: pytest -m slow)"]
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning"]
